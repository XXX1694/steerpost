# Steerpost production stack for a single server: Caddy (automatic HTTPS) in front of the published GHCR images.
#
#   cd /opt/socialos && ./deploy.sh sha-1a2b3c4      # normal path: pull, migrate, restart, health-check, roll back on failure
#   docker compose -f docker-compose.prod.yml ps     # plain compose works too: configuration comes from ./.env
#
# Only Caddy publishes ports (80, 443). Postgres, Redis, MinIO, the API, the worker, the MCP server and the frontend
# are reachable only on the internal compose network. See README.md for the full walkthrough and .env.prod.example for
# every variable.
#
# Behind an existing reverse proxy instead (the host already owns 80/443)? Add docker-compose.host-proxy.yml to
# COMPOSE_FILE: it turns the bundled Caddy off, publishes the services on 127.0.0.1 and lowers the memory limits.
#
# mem_limit is a hard cap per container (the container is OOM-killed above it), not a reservation. The defaults below are
# generous for a dedicated 2-4 GB server; override them in .env with <SERVICE>_MEM_LIMIT.

name: socialos

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Hardening shared by the Steerpost containers (not applied to postgres/redis/minio/caddy, which need their defaults).
x-app: &app
  restart: unless-stopped
  logging: *default-logging
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

# Images are built and pushed by .github/workflows/release.yml. GHCR_OWNER must be lowercase.
# IMAGE_TAG is written by deploy.sh (sha-<7 hex>, main, vX.Y.Z). Do not point production at a moving tag by hand.
x-backend-image: &backend-image ghcr.io/${GHCR_OWNER:-xxx1694}/socialos-backend:${IMAGE_TAG:-main}

x-backend-env: &backend-env
  APP_ENV: production # the backend refuses insecure cookies, the in-memory storage driver and the mock provider here
  LOG_FORMAT: json
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER:-socialos}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-socialos}?sslmode=disable
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (openssl rand -base64 32)}
  METRICS_TOKEN: ${METRICS_TOKEN:-}

  # Public URLs. Browsers talk to app.<domain>; /api/v1/* is proxied to the backend by the frontend (same origin).
  # api.<domain> serves API-key clients, the Telegram webhook and OAuth callbacks.
  API_PUBLIC_URL: https://api.${DOMAIN:?set DOMAIN in .env}
  WEB_BASE_URL: https://app.${DOMAIN}
  CORS_ALLOWED_ORIGINS: https://app.${DOMAIN}
  MCP_PUBLIC_URL: https://mcp.${DOMAIN}/mcp
  # Shared with the mcp service. With it the backend believes the client IP the MCP server forwards (X-SocialOS-Client-IP)
  # and writes it to the audit log of MCP tool calls; empty = the header is ignored (init-env.sh generates it).
  MCP_GATEWAY_SECRET: ${MCP_GATEWAY_SECRET:-}
  COOKIE_SECURE: "true"
  # The OAuth callback lands on api.<domain>, the login cookie is issued via app.<domain>: share it across the subdomains.
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-${DOMAIN}}
  # Caddy sets X-Forwarded-For (it replaces whatever the client sent); nothing else can reach the backend. The client
  # address is the right-most hop that is not in TRUSTED_PROXIES, so a forged header cannot pick the rate-limit bucket.
  TRUST_PROXY: "true"
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-} # empty = loopback + private ranges (the compose network); see .env.prod.example

  # Object storage. Default: the bundled MinIO ("minio" profile). For S3/R2 set S3_ENDPOINT, S3_USE_SSL=true and
  # S3_PUBLIC_ENDPOINT= (empty) in .env, and drop the minio profile.
  STORAGE_DRIVER: s3
  S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT-s3.${DOMAIN}}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
  S3_BUCKET: ${S3_BUCKET:-socialos-media}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_USE_SSL: ${S3_USE_SSL:-false}
  S3_AUTO_CREATE_BUCKET: ${S3_AUTO_CREATE_BUCKET:-true}

  # Social networks.
  SOCIAL_MOCK_PROVIDERS: "false"
  LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
  LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
  # Social sign-in (empty = provider off; set both of a pair).
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_UPDATES_MODE: webhook
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?set TELEGRAM_WEBHOOK_SECRET in .env (openssl rand -hex 24)}

  # Transactional email (see backend/.env.example).
  MAIL_PROVIDER: ${MAIL_PROVIDER:-log}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_TLS: ${SMTP_TLS:-starttls}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-}

  # Plan limits are opt-in; -1 (the default) means unlimited (see backend/.env.example).
  QUOTA_ACCOUNTS: ${QUOTA_ACCOUNTS:--1}
  QUOTA_POSTS_PER_MONTH: ${QUOTA_POSTS_PER_MONTH:--1}
  QUOTA_MEDIA_MB: ${QUOTA_MEDIA_MB:--1}
  QUOTA_AGENT_RPM: ${QUOTA_AGENT_RPM:--1}
  # Days a finished data export stays downloadable before the worker deletes it (D-018).
  EXPORT_RETENTION_DAYS: ${EXPORT_RETENTION_DAYS:-7}
  # Days an account stays recoverable after its owner asked for deletion (D-019).
  ACCOUNT_DELETION_GRACE_DAYS: ${ACCOUNT_DELETION_GRACE_DAYS:-7}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-socialos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-socialos}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: ${POSTGRES_MEM_LIMIT:-768m}
    shm_size: 256mb
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    mem_limit: ${REDIS_MEM_LIMIT:-192m}
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(redis-cli ping)\" = PONG ]"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Bundled S3-compatible storage. Enabled by COMPOSE_PROFILES=minio in .env (the default in .env.prod.example).
  minio:
    profiles: ["minio"]
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest-dev@sha256:22660c7a21cfe5ff9cb3376af8f00d5475a0bf15e4a8ad3951d7ad99a9adf2e1}
    restart: unless-stopped
    logging: *default-logging
    command: ["server", "/data", "--console-address", ":9001"] # the console port is not published; use an SSH tunnel
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes:
      - minio-data:/data
    mem_limit: ${MINIO_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # One-shot: applies pending SQL migrations, then exits. deploy.sh also runs it explicitly before the restart.
  migrate:
    <<: *app
    image: *backend-image
    command: ["/app/migrate", "up"]
    environment: *backend-env
    mem_limit: ${MIGRATE_MEM_LIMIT:-384m}
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres: { condition: service_healthy }

  backend:
    <<: *app
    image: *backend-image
    command: ["/app/api"]
    environment: *backend-env
    mem_limit: ${BACKEND_MEM_LIMIT:-384m}
    # healthcheck: from the image (`/app/api healthcheck` -> GET /health)
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy, required: false }

  worker:
    <<: *app
    image: *backend-image
    command: ["/app/worker"]
    environment: *backend-env
    stop_grace_period: 45s # WORKER_SHUTDOWN_TIMEOUT (max 35s) + 5s for background jobs must fit in it, so in-flight publishes finish before Docker kills the worker
    mem_limit: ${WORKER_MEM_LIMIT:-384m}
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck", "http://127.0.0.1:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy, required: false }

  mcp:
    <<: *app
    image: ghcr.io/${GHCR_OWNER:-xxx1694}/socialos-mcp:${IMAGE_TAG:-main}
    environment:
      # Both names: the server reads STEERPOST_* first, SOCIALOS_* keeps an older image working after a rollback (D-020).
      STEERPOST_API_URL: http://backend:8080
      SOCIALOS_API_URL: http://backend:8080
      PORT: "3333"
      MCP_GATEWAY_SECRET: ${MCP_GATEWAY_SECRET:-}
      # Caddy sits in front of this service as well: same rule as the backend (right-most hop outside TRUSTED_PROXIES).
      TRUST_PROXY: "true"
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    mem_limit: ${MCP_MEM_LIMIT:-192m}
    # healthcheck: from the image (GET /health)
    depends_on:
      backend: { condition: service_healthy }

  # API_INTERNAL_URL and NEXT_PUBLIC_* are baked into this image at build time (release workflow, from the repo
  # variables API_PUBLIC_URL / MCP_PUBLIC_URL). Nothing set here can change them: see README.md, "Frontend URLs".
  frontend:
    <<: *app
    image: ghcr.io/${GHCR_OWNER:-xxx1694}/socialos-frontend:${IMAGE_TAG:-main}
    mem_limit: ${FRONTEND_MEM_LIMIT:-512m}
    environment:
      # Shown on /privacy and /terms; read per request, so a restart is enough to change them.
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      OPERATOR_CONTACT: ${OPERATOR_CONTACT:-}
    # healthcheck: from the image (GET /login)
    depends_on:
      backend: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${CADDY_MEM_LIMIT:-192m}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      # Needed by this service only, and it is not part of host-proxy mode. Compose interpolates every service, enabled or not,
      # so a required-variable check here would also demand it there; deploy.sh checks it for the standalone stack instead.
      ACME_EMAIL: ${ACME_EMAIL:-}
      # Public host for presigned media URLs (bundled MinIO). Use ":8099" (an unpublished, unused port) to turn it off.
      S3_SITE: ${S3_SITE:-s3.${DOMAIN}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates and ACME account: keep this volume
      - caddy-config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Operator tool, never started by `up`:
  #   docker compose -f docker-compose.prod.yml run --rm telegram set-webhook     (also: webhook-info, delete-webhook)
  # It is `make -C backend telegram-set-webhook` for the production stack.
  telegram:
    profiles: ["tools"]
    image: *backend-image
    entrypoint: ["/app/telegram"]
    environment: *backend-env
    restart: "no"
    healthcheck:
      disable: true

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
