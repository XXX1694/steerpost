# Steerpost local development stack: `docker compose up` (or `make up`).
# Configuration comes from .env (copy .env.example; `make env` does it and generates ENCRYPTION_KEY).
# Every long-running service has a healthcheck, so `docker compose up -d --wait` blocks until the stack is
# usable: postgres, redis, minio and worker are defined below; backend, mcp and frontend use the HEALTHCHECK
# baked into their images (backend/Dockerfile, mcp/Dockerfile, frontend/Dockerfile).
# The production stack (published GHCR images, Caddy, HTTPS) is deploy/docker-compose.prod.yml.
name: socialos

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  LOG_FORMAT: json
  DATABASE_URL: postgres://${POSTGRES_USER:-socialos}:${POSTGRES_PASSWORD:-socialos}@postgres:5432/${POSTGRES_DB:-socialos}?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (make env generates one)}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8080}
  WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
  MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:3333/mcp}
  MCP_GATEWAY_SECRET: ${MCP_GATEWAY_SECRET:-} # shared with the mcp service; empty = the client IP forwarded by MCP is ignored
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  STORAGE_DRIVER: s3
  S3_ENDPOINT: minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-localhost:9000}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-socialos}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-socialos-dev-secret}
  S3_BUCKET: ${S3_BUCKET:-socialos-media}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_USE_SSL: "false"
  S3_AUTO_CREATE_BUCKET: "true"
  SOCIAL_MOCK_PROVIDERS: ${SOCIAL_MOCK_PROVIDERS:-true}
  LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
  LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
  # Social sign-in (empty = provider off; set both of a pair).
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_UPDATES_MODE: ${TELEGRAM_UPDATES_MODE:-polling}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}

  # Transactional email (see backend/.env.example).
  MAIL_PROVIDER: ${MAIL_PROVIDER:-log}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_TLS: ${SMTP_TLS:-starttls}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-}

  # Plan limits are opt-in; -1 (the default) means unlimited (see backend/.env.example).
  QUOTA_ACCOUNTS: ${QUOTA_ACCOUNTS:--1}
  QUOTA_POSTS_PER_MONTH: ${QUOTA_POSTS_PER_MONTH:--1}
  QUOTA_MEDIA_MB: ${QUOTA_MEDIA_MB:--1}
  QUOTA_AGENT_RPM: ${QUOTA_AGENT_RPM:--1}
  # Days a finished data export stays downloadable before the worker deletes it (D-018).
  EXPORT_RETENTION_DAYS: ${EXPORT_RETENTION_DAYS:-7}
  # Days an account stays recoverable after its owner asked for deletion (D-019).
  ACCOUNT_DELETION_GRACE_DAYS: ${ACCOUNT_DELETION_GRACE_DAYS:-7}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-socialos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-socialos}
      POSTGRES_DB: ${POSTGRES_DB:-socialos}
    volumes: [postgres-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # MinIO stopped publishing images (Docker Hub removed minio/minio in Sept 2026), so this uses Chainguard's
    # maintained build. Pinned by digest; Dependabot proposes updates. The -dev variant ships wget for the healthcheck.
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest-dev@sha256:22660c7a21cfe5ff9cb3376af8f00d5475a0bf15e4a8ad3951d7ad99a9adf2e1}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-socialos}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-socialos-dev-secret}
    volumes: [minio-data:/data]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    command: ["/app/migrate", "up"]
    environment: *backend-env
    healthcheck:
      disable: true # one-shot: the image's HEALTHCHECK probes the API port, which a migration run never opens
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  backend:
    build: ./backend
    command: ["/app/api"]
    environment: *backend-env
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["/app/worker"]
    environment: *backend-env
    stop_grace_period: 45s # WORKER_SHUTDOWN_TIMEOUT (max 35s) + 5s for background jobs must fit in it, so in-flight publishes finish before Docker kills the worker
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck", "http://127.0.0.1:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped

  mcp:
    build: ./mcp
    environment:
      # Both names: the server reads STEERPOST_* first, SOCIALOS_* keeps an older image working after a rollback (D-020).
      STEERPOST_API_URL: http://backend:8080
      SOCIALOS_API_URL: http://backend:8080
      PORT: "3333"
      MCP_GATEWAY_SECRET: ${MCP_GATEWAY_SECRET:-}
    ports: ["127.0.0.1:3333:3333"]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://backend:8080
        NEXT_PUBLIC_MCP_URL: ${MCP_PUBLIC_URL:-http://localhost:3333/mcp}
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:8080}
    environment:
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      OPERATOR_CONTACT: ${OPERATOR_CONTACT:-}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
