name: Release

# Builds the three images and pushes them to GHCR:
#   ghcr.io/<owner>/socialos-backend | socialos-mcp | socialos-frontend      (owner is lower-cased)
# and, from the same build and with the same tags and digest, steerpost-backend | steerpost-mcp | steerpost-frontend (D-020).
#
#   * every commit on main whose CI run succeeded  ->  sha-<7 hex> and main
#   * a tag vX.Y.Z (or vX.Y.Z-rc.1)                ->  X.Y.Z, X.Y (and X from 1.0 on); no sha tag, so it stays immutable
#   * manual run (Run workflow)                    ->  rebuild a ref, e.g. after changing the frontend URL variables
#
# After a successful main release the Deploy workflow is started (skipped unless the DEPLOY_* secrets exist).
#
# A tag push ALSO creates the GitHub Release of that tag, as the last step and only when all three images were pushed
# (job github-release). That is what servers with deploy/autoupdate.sh poll (releases/latest), so a release can never be
# visible before its images exist. The notes are the "## [X.Y.Z]" section of CHANGELOG.md; the run fails if it is missing.
# vX.Y.Z-rc.N tags become pre-releases and never "latest". Re-running updates the notes of an existing release.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables), all optional:
#   API_PUBLIC_URL     public URL of the API, baked into the frontend       default http://localhost:8080
#   MCP_PUBLIC_URL     public URL of the MCP endpoint, baked into frontend  default http://localhost:3333/mcp
#   API_INTERNAL_URL   backend address inside the compose network           default http://backend:8080
#   RELEASE_PLATFORMS  image platforms                                      default linux/amd64,linux/arm64
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PLATFORMS: ${{ vars.RELEASE_PLATFORMS || 'linux/amd64,linux/arm64' }}

jobs:
  images:
    name: Push ${{ matrix.image }}
    # For workflow_run: only successful CI runs triggered by a push (never a pull request).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
          - image: mcp
            context: mcp
          # API_INTERNAL_URL and NEXT_PUBLIC_* are baked into the frontend image at build time: they must be the
          # production values, so they come from repository variables. See deploy/README.md, "Frontend URLs".
          - image: frontend
            context: frontend
            build_args: |
              API_INTERNAL_URL=${{ vars.API_INTERNAL_URL || 'http://backend:8080' }}
              NEXT_PUBLIC_API_URL=${{ vars.API_PUBLIC_URL || 'http://localhost:8080' }}
              NEXT_PUBLIC_MCP_URL=${{ vars.MCP_PUBLIC_URL || 'http://localhost:3333/mcp' }}
    steps:
      - name: Frontend URLs are not configured
        if: matrix.image == 'frontend' && (vars.API_PUBLIC_URL == '' || vars.MCP_PUBLIC_URL == '')
        run: >-
          echo "::warning title=Frontend built with localhost URLs::Repository variable API_PUBLIC_URL and/or
          MCP_PUBLIC_URL is not set, so the frontend image points at localhost. That is fine for a smoke test and wrong
          for production. Set the variables (https://api.<domain>, https://mcp.<domain>/mcp) and run this workflow again."

      - uses: actions/checkout@v7
        with:
          # For workflow_run, github.sha is the latest commit of main, not the commit CI verified.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Work out the tags
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          IMAGE: ${{ matrix.image }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${RUN_SHA:-$GITHUB_SHA}"
          short="${sha:0:7}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="ghcr.io/${owner}/socialos-${IMAGE}"
          # sha-<7 hex> is immutable (what deploys pin), so only the main/manual build of a commit pushes it. A tag build is a
          # second build of that commit with another digest (other VERSION and BUILT_AT), so it pushes only version tags.
          tags=()
          if [ "$REF_TYPE" != tag ]; then tags+=("${repo}:sha-${short}"); fi
          version=""

          # "main" must follow the tip of main. A slower CI run for an older commit must not move it backwards.
          candidate=false
          if [ "$EVENT" = workflow_run ]; then candidate=true; fi
          if [ "$EVENT" = workflow_dispatch ] && [ "$REF_TYPE" = branch ] && [ "$REF_NAME" = main ]; then candidate=true; fi
          if [ "$candidate" = true ]; then
            tip="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
            if [ "$tip" = "$sha" ]; then
              tags+=("${repo}:main")
            else
              echo "::notice title=main tag not moved::${short} is no longer the tip of main (${tip:0:7}); only the sha tag is pushed."
            fi
          fi

          if [ "$REF_TYPE" = tag ]; then
            if [[ "$REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              pre="${BASH_REMATCH[4]}"
              version="${major}.${minor}.${BASH_REMATCH[3]}${pre}"
              tags+=("${repo}:${version}")
              if [ -z "$pre" ]; then
                tags+=("${repo}:${major}.${minor}")
                if [ "$major" != 0 ]; then tags+=("${repo}:${major}"); fi
              fi
            else
              echo "::error title=Not a semver tag::${REF_NAME} does not look like vMAJOR.MINOR.PATCH[-pre]; nothing is pushed."
              exit 1
            fi
          fi

          # D-020: the same build is also published as steerpost-<image>. One push with all tags, so both names share one
          # digest. Compose keeps pulling socialos-* until every server is moved; the image.title label stays socialos-*.
          alias_repo="ghcr.io/${owner}/steerpost-${IMAGE}"
          for t in "${tags[@]}"; do tags+=("${alias_repo}:${t#"${repo}":}"); done

          {
            echo "sha=${sha}"
            echo "short=${short}"
            echo "version=${version:-sha-${short}}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"
          {
            echo "### socialos-${IMAGE} (also steerpost-${IMAGE})"
            for t in "${tags[@]}"; do echo "- \`${t}\`"; done
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Base images come through Google's Docker Hub cache: Docker Hub's anonymous limit hits shared runner IPs (ci.yml).
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # VERSION, COMMIT and BUILT_AT become GET /version of the backend (internal/buildinfo); the other images ignore them.
          build-args: |
            ${{ matrix.build_args }}
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.short }}
            BUILT_AT=${{ steps.meta.outputs.built_at }}
          labels: |
            org.opencontainers.image.title=socialos-${{ matrix.image }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          provenance: false
          cache-from: |
            type=gha,scope=release-${{ matrix.image }}
            type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}

  # The GitHub Release of a tag, created only after every image was pushed. Idempotent: an existing release only gets
  # its notes updated. Tag protection (who may create v* tags) is a repository setting, not part of this job.
  github-release:
    name: GitHub Release
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error title=Not a version tag::${TAG} is not vMAJOR.MINOR.PATCH[-pre]"
            exit 1
          fi
          if ! .github/scripts/changelog-section.sh "${BASH_REMATCH[1]}" CHANGELOG.md >"$RUNNER_TEMP/notes.md"; then
            echo "::error title=CHANGELOG.md::No non-empty '## [${BASH_REMATCH[1]}]' section. Add it and move the entries out of [Unreleased], then move the tag (or delete it and tag again)."
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Create the release (or update its notes)
        run: .github/scripts/publish-release.sh "$TAG" "$RUNNER_TEMP/notes.md"

  # Hands the exact commit that was just released to the Deploy workflow. It is a dispatch (not a workflow_run
  # trigger) on purpose: the run that Deploy would see as "triggering" is stamped with the latest commit of main,
  # which can already be newer than the one that was released.
  trigger-deploy:
    name: Trigger deploy
    needs: images
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch the Deploy workflow
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::notice title=Deploy skipped::DEPLOY_HOST, DEPLOY_USER and DEPLOY_SSH_KEY are not all set as repository secrets, so nothing is deployed automatically. See deploy/README.md."
            exit 0
          fi
          tip="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEFAULT_BRANCH}" --jq .sha)"
          if [ "$tip" != "$SHA" ]; then
            echo "::notice title=Deploy skipped::${SHA:0:7} is no longer the tip of ${DEFAULT_BRANCH} (${tip:0:7}); the newer commit will be released and deployed instead."
            exit 0
          fi
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" -f "tag=sha-${SHA:0:7}"
          echo "Started the Deploy workflow for sha-${SHA:0:7}"
